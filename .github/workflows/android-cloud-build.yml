name: Build Pulsly Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK path
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          test -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms/android-35"
          ls -la "$ANDROID_HOME/build-tools/35.0.0"

      - name: Install dependencies
        run: bun install

      - name: Build Pulsly web app
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Create Android project
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Show Capacitor configuration
        run: bunx cap doctor android
        continue-on-error: true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Pulsly debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify Pulsly APK
        shell: bash
        run: |
          echo "Generated APK:"
          ls -lh android/app/build/outputs/apk/debug/

          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Pulsly APK
        uses: actions/upload-artifact@v4
        with:
          name: pulsly-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
