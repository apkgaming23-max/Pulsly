name: Build Pulsly Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK path
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          test -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK verified"

      - name: Install dependencies
        run: bun install

      - name: Build Pulsly web app
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Create Android project
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Set Android minimum SDK to 26
        shell: bash
        run: |
          test -f android/variables.gradle

          sed -i -E \
            's/minSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/minSdkVersion = 26/' \
            android/variables.gradle

          echo "Android SDK configuration:"
          grep "minSdkVersion" android/variables.gradle

          grep -q "minSdkVersion = 26" android/variables.gradle

      - name: Configure Pulsly Health Connect manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest_path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest_path.exists():
              raise SystemExit(
                  "AndroidManifest.xml was not generated"
              )

          permissions = [
              "android.permission.health.READ_STEPS",
              "android.permission.health.READ_DISTANCE",
              "android.permission.health.READ_ACTIVE_CALORIES_BURNED",
              "android.permission.health.READ_HEART_RATE",
              "android.permission.health.READ_EXERCISE",
          ]

          android_namespace = (
              "http://schemas.android.com/apk/res/android"
          )

          android_name = (
              "{"
              + android_namespace
              + "}name"
          )

          ET.register_namespace(
              "android",
              android_namespace
          )

          tree = ET.parse(manifest_path)

          root = tree.getroot()

          existing_permissions = {
              element.get(android_name)
              for element in root.findall(
                  "uses-permission"
              )
          }

          for permission in permissions:
              if permission not in existing_permissions:
                  element = ET.Element(
                      "uses-permission"
                  )

                  element.set(
                      android_name,
                      permission
                  )

                  root.insert(
                      0,
                      element
                  )

          tree.write(
              manifest_path,
              encoding="utf-8",
              xml_declaration=True
          )

          print(
              "Health Connect permissions added:"
          )

          for permission in permissions:
              print(permission)

          PY

          echo ""
          echo "Final AndroidManifest.xml:"
          cat android/app/src/main/AndroidManifest.xml

      - name: Verify Pulsly Health Connect permissions
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          grep -q \
            "android.permission.health.READ_STEPS" \
            "$MANIFEST"

          grep -q \
            "android.permission.health.READ_DISTANCE" \
            "$MANIFEST"

          grep -q \
            "android.permission.health.READ_ACTIVE_CALORIES_BURNED" \
            "$MANIFEST"

          grep -q \
            "android.permission.health.READ_HEART_RATE" \
            "$MANIFEST"

          grep -q \
            "android.permission.health.READ_EXERCISE" \
            "$MANIFEST"

          echo ""
          echo "All Pulsly Health Connect permissions verified."

      - name: Show Capacitor configuration
        run: bunx cap doctor android
        continue-on-error: true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Pulsly debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify Pulsly APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking generated APK..."

          test -f "$APK"

          ls -lh "$APK"

          echo ""
          echo "Pulsly APK successfully generated."

      - name: Upload Pulsly APK
        uses: actions/upload-artifact@v4
        with:
          name: pulsly-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
