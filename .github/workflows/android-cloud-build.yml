name: Build Pulsly Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK path
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        run: bun install

      - name: Build Pulsly web app
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Create Android project
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Set Android minimum SDK to 26
        shell: bash
        run: |
          test -f android/variables.gradle
          sed -i -E 's/minSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/minSdkVersion = 26/' android/variables.gradle
          grep "minSdkVersion" android/variables.gradle

      - name: Configure Pulsly Health Connect manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          permissions = [
              "android.permission.health.READ_STEPS",
              "android.permission.health.READ_DISTANCE",
              "android.permission.health.READ_ACTIVE_CALORIES_BURNED",
              "android.permission.health.READ_HEART_RATE",
              "android.permission.health.READ_EXERCISE",
          ]

          additions = []
          for permission in permissions:
              marker = f'android:name="{permission}"'
              if marker not in text:
                  additions.append(f'    <uses-permission android:name="{permission}" />')

          if additions:
              pos = text.find(">")
              if pos == -1 or "<manifest" not in text[:pos + 1]:
                  raise SystemExit("Could not locate <manifest> opening tag")
              text = text[:pos + 1] + "\n" + "\n".join(additions) + text[pos + 1:]
              manifest.write_text(text, encoding="utf-8")

          print(manifest.read_text(encoding="utf-8"))
          PY

      - name: Verify Pulsly Health Connect permissions
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -F 'android.permission.health.READ_STEPS' "$MANIFEST"
          grep -F 'android.permission.health.READ_DISTANCE' "$MANIFEST"
          grep -F 'android.permission.health.READ_ACTIVE_CALORIES_BURNED' "$MANIFEST"
          grep -F 'android.permission.health.READ_HEART_RATE' "$MANIFEST"
          grep -F 'android.permission.health.READ_EXERCISE' "$MANIFEST"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Pulsly debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify Pulsly APK
        shell: bash
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Pulsly APK
        uses: actions/upload-artifact@v4
        with:
          name: pulsly-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
